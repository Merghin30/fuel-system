name: MOKA App Enterprise CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Node.js 22.x Runtime
      uses: actions/setup-node@v3
      with:
        node-node-version: 22

    - name: Install Dependencies
      run: npm ci

    - name: Validate TypeScript Compilation (tsc)
      run: npm run lint

    - name: Compile Production Bundle (Vite + esbuild)
      run: npm run build

    - name: Verify Build Artifacts
      run: |
        test -d dist
        test -f dist/server.cjs
        test -f dist/index.html
